name: writing-plans

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pytest ruff || true

      - name: Run tests
        run: |
          python -m pytest tests/ -v

      - name: Lint
        run: |
          ruff check scripts/ tests/ || true
