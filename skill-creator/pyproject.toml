[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-creator"
version = "1.0.0"
description = "TDD-based skill creation: scaffold, validate, eval, benchmark and optimize agent skills."
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
